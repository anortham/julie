[package]
name = "julie-pipeline"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Indexing and embedding pipeline layer above julie-index"

[dependencies]
# Julie workspace crates
julie-core = { path = "../julie-core" }
julie-index = { path = "../julie-index" }
julie-facts = { path = "../julie-facts" }
julie-extractors = { git = "https://github.com/anortham/julie-extractors", tag = "v2.42.0" }

# Async runtime
tokio = { version = "1.47.1", features = ["full"] }

# Async futures
futures = "0.3"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Platform directories (native sidecar cache root)
dirs = "6"

# Hashing (native sidecar binary verification and broker key derivation)
sha2 = "0.10"
hex = "0.4"
blake3 = "1.8"

# System bindings (peer PID retrieval on unix domain sockets)
libc = "0.2"

[dev-dependencies]
tempfile = "3.13"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serial_test = { version = "3.2", features = ["file_locks"] }
