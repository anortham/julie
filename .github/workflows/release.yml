name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v2.0.0

permissions:
  contents: write  # Required for creating releases

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Server binary build (julie-server)
  #
  # Each archive holds julie-server and the native julie-semantic-sidecar
  # side by side. The script .github/scripts/pack-release.sh downloads the
  # pinned sidecar release, checks its sha256, and packs both binaries.
  # ==========================================================================
  validate-release:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Match tag, package, and release notes
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          [ "$TAG_VERSION" = "$CARGO_VERSION" ] || {
            echo "tag version $TAG_VERSION does not match Cargo.toml $CARGO_VERSION" >&2
            exit 1
          }
          NOTES_PATH="docs/release-notes/v${TAG_VERSION}.md"
          [ -f "$NOTES_PATH" ] || {
            echo "release notes missing: $NOTES_PATH" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.target }}
    needs: [validate-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (sidecar bundled by pack-release.sh, vulkan)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: ".exe"

          # macOS Apple Silicon (sidecar bundled by pack-release.sh, metal)
          - os: macos-latest
            target: aarch64-apple-darwin
            exe_suffix: ""

          # macOS Intel (sidecar bundled by pack-release.sh, metal)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe_suffix: ""

          # Linux (sidecar bundled by pack-release.sh, vulkan)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install lld (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install lld
          # Homebrew installs ld64.lld at $(brew --prefix lld)/bin/ld64.lld
          # Symlink it into /usr/local/bin so clang's -fuse-ld=lld finds it.
          LLD_PREFIX="$(brew --prefix lld)"
          echo "${LLD_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (julie-server)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin julie-server

      - name: Strip binaries (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/julie-server${{ matrix.exe_suffix }}

      - name: Ad-hoc codesign (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          codesign --force --sign - target/${{ matrix.target }}/release/julie-server${{ matrix.exe_suffix }}

      - name: Create archive (julie-server + julie-semantic-sidecar)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE=$(bash .github/scripts/pack-release.sh "${{ matrix.target }}" "${GITHUB_REF#refs/tags/v}" "target/${{ matrix.target }}/release" . | tail -n 1)
          echo "ARCHIVE=$(basename "${ARCHIVE}")" >> $GITHUB_ENV

      - name: Write archive checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Verify packaged archive
        shell: bash
        run: |
          WINDOWS=()
          if [ "${{ matrix.os }}" = "windows-latest" ]; then WINDOWS+=(--windows); fi
          python3 .github/scripts/verify-release-archive.py "${ARCHIVE}" --sha256 "${ARCHIVE}.sha256" --version "${GITHUB_REF#refs/tags/v}" --sidecar-version "0.1.0" "${WINDOWS[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  # ==========================================================================
  # Create GitHub release with all artifacts
  # ==========================================================================
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release with gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Create release notes. Prefer a checked-in versioned note when one
          # exists so contract releases do not publish generic notes.
          NOTES_PATH="docs/release-notes/v${VERSION}.md"
          if [ -f "${NOTES_PATH}" ]; then
            cp "${NOTES_PATH}" release-notes.md
          else
            cat > release-notes.md << EOF
          ## Julie v${{ steps.version.outputs.version }}

          Cross-platform code intelligence server for AI coding agents.

          ### What's Included

          Each archive ships two binaries at the archive root:

          - **\`julie-server\`**: the MCP entry point your client spawns.
          - **\`julie-semantic-sidecar\`**: the native embedding sidecar for semantic search (metal on macOS, vulkan on Linux and Windows). julie-server finds it beside itself.

          ### Platform Support
          | Platform | Archive |
          |----------|---------|
          | macOS Apple Silicon | \`.tar.gz\` |
          | macOS Intel | \`.tar.gz\` |
          | Windows x86_64 | \`.zip\` |
          | Linux x86_64 | \`.tar.gz\` |

          ### Quick Start
          \`\`\`bash
          # 1. Extract the archive for your platform.
          # 2. Configure your MCP client to spawn julie-server.
          \`\`\`

          See [README.md](https://github.com/${{ github.repository }}) for full documentation.
          EOF
          fi

          # Create release
          gh release create "v${VERSION}" \
            --title "Julie v${VERSION}" \
            --notes-file release-notes.md

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Upload all artifacts
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              if [ -f "$file" ]; then
                echo "Uploading $(basename "$file")..."
                gh release upload "v${VERSION}" "$file" --clobber
              fi
            done
          done

      - name: Verify four public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "julie-v${VERSION}-${target}.tar.gz" --pattern "julie-v${VERSION}-${target}.tar.gz.sha256" --dir public-assets
          done
          gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "julie-v${VERSION}-x86_64-pc-windows-msvc.zip" --pattern "julie-v${VERSION}-x86_64-pc-windows-msvc.zip.sha256" --dir public-assets
          python3 .github/scripts/verify-release-assets.py public-assets "${VERSION}"

  update-plugin:
    name: Update plugin from verified release
    needs: [release]
    uses: anortham/julie-plugin/.github/workflows/update-binaries.yml@d427fec9df777b045d4562a4e56e3f14f0a7a260
    with:
      version: ${{ needs.release.outputs.version }}
      tag: v${{ needs.release.outputs.version }}
      plugin_source_sha: d427fec9df777b045d4562a4e56e3f14f0a7a260
    secrets:
      publication_token: ${{ secrets.PLUGIN_REPO_TOKEN }}

  verify-plugin-publication:
    name: Verify published plugin snapshot
    needs: [release, update-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact published plugin commit
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/anortham/julie-plugin.git plugin
          cd plugin
          git checkout --detach "${{ needs.update-plugin.outputs.published_sha }}"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.0
      - name: Verify manifests, archives, hooks, and instructions
        run: |
          cd plugin
          VERSION="${{ needs.release.outputs.version }}"
          node --test hooks/*.test.cjs
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const manifests = [
            ['package.json', value => value.version],
            ['plugin.json', value => value.version],
            ['.claude-plugin/plugin.json', value => value.version],
            ['.codex-plugin/plugin.json', value => value.version],
            ['.claude-plugin/marketplace.json', value => value.plugins[0].version],
            ['.agents/plugins/marketplace.json', value => value.plugins[0].version],
          ];
          for (const [path, getVersion] of manifests) {
            if (getVersion(JSON.parse(fs.readFileSync(path))) !== version) throw new Error(`version mismatch: ${path}`);
          }
          for (const path of ['mcp.json', 'mcp_config.json', 'hooks/hooks.json', 'JULIE_AGENT_INSTRUCTIONS.md']) {
            if (!fs.statSync(path).size) throw new Error(`missing required plugin file: ${path}`);
          }
          NODE
          for archive in \
            "julie-v${VERSION}-aarch64-apple-darwin.tar.gz" \
            "julie-v${VERSION}-x86_64-apple-darwin.tar.gz" \
            "julie-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "julie-v${VERSION}-x86_64-pc-windows-msvc.zip"; do
            test -f "bin/archives/$archive"
          done
          [ "$(find bin/archives -maxdepth 1 -type f -name "julie-v${VERSION}-*" | wc -l)" -eq 4 ]
          find . -type l -print -quit | grep -q . && { echo "generated plugin contains a symlink" >&2; exit 1; } || true
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            test ! -e "bin/$target"
          done
