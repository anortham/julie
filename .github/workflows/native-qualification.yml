name: Native qualification

on:
  push:
    branches:
      - 'qualification/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to qualify
        required: true
        default: main

permissions:
  contents: read

jobs:
  native-archive:
    name: Native ${{ matrix.target }} qualification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install lld (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build candidate archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          cargo build --release --target "${{ matrix.target }}" --bin julie-server
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            codesign --force --sign - "target/${{ matrix.target }}/release/julie-server"
          fi
          ARCHIVE=$(bash .github/scripts/pack-release.sh "${{ matrix.target }}" "$VERSION" "target/${{ matrix.target }}/release" . | tail -n 1)
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify archive
        shell: bash
        run: |
          WINDOWS=()
          if [ "${{ matrix.os }}" = windows-latest ]; then WINDOWS+=(--windows); fi
          python3 .github/scripts/verify-release-archive.py "$ARCHIVE" --sha256 "$ARCHIVE.sha256" --version "$VERSION" --sidecar-version 0.1.0 "${WINDOWS[@]}"

      - name: Exercise packaged server (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/julie-native-qualification"
          PROFILE="$ROOT/fresh-profile"
          rm -rf "$ROOT"
          mkdir -p "$PROFILE" "$ROOT/archive"
          tar -xzf "$ARCHIVE" -C "$ROOT/archive"
          SERVER="$ROOT/archive/julie-server"
          export HOME="$PROFILE" JULIE_HOME="$PROFILE/.julie" JULIE_SESSION_HOOKS=0
          "$SERVER" --version
          "$SERVER" tools list --json
          for cwd in "$ROOT/first" "$ROOT/second"; do
          mkdir -p "$cwd"
          SERVER="$SERVER" CWD="$cwd" python3 - <<'PY'
          import json
          import os
          import subprocess

          request = b'{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"native-qualification","version":"1"}}}\n'
          result = subprocess.run(
              [os.environ["SERVER"]],
              cwd=os.environ["CWD"],
              input=request,
              capture_output=True,
              timeout=30,
          )
          if result.returncode:
              raise SystemExit(result.stderr.decode())
          response = json.loads(result.stdout)
          instructions = response["result"]["instructions"]
          if not instructions or "workspace" not in instructions.lower():
              raise SystemExit("initialize response lacks workspace-routing instructions")
          record = json.load(open(os.path.join(os.environ["JULIE_HOME"], "service.json")))
          pid = str(record["pid"])
          pid_path = os.path.join(os.path.dirname(os.path.dirname(os.environ["JULIE_HOME"])), "service-pid")
          if os.path.exists(pid_path) and open(pid_path).read().strip() != pid:
              raise SystemExit("second initialize did not reuse the service PID")
          open(pid_path, "w").write(pid)
          PY
          done
          service_pid=$(cat "$ROOT/service-pid")
          old_pid="$service_pid"
          "$SERVER" service status
          "$SERVER" service restart
          restart_pid=$(python3 -c 'import json, os; print(json.load(open(os.path.join(os.environ["JULIE_HOME"], "service.json")))["pid"])')
          test "$old_pid" != "$restart_pid"
          ! kill -0 "$old_pid" 2>/dev/null
          "$SERVER" service stop
          test ! -e "$JULIE_HOME/service.json"
          ! pgrep -f "$SERVER" >/dev/null

      - name: Exercise packaged server (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'julie-native-qualification-runtime'
          $profile = Join-Path $root 'fresh-profile'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $profile, (Join-Path $root 'archive') | Out-Null
          Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath (Join-Path $root 'archive')
          $server = Join-Path $root 'archive/julie-server.exe'
          $env:HOME = $profile
          $env:USERPROFILE = $profile
          $env:JULIE_HOME = Join-Path $profile '.julie'
          $env:JULIE_SESSION_HOOKS = '0'
          & $server --version
          & $server tools list --json
          $initialize = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"native-qualification","version":"1"}}}'
          function Initialize-PackagedServer($cwd) {
            Push-Location $cwd
            try {
              $response = (($initialize | & $server) -join "`n") | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "packaged initialize failed: $LASTEXITCODE" }
              if ([string]::IsNullOrWhiteSpace($response.result.instructions) -or !$response.result.instructions.ToLowerInvariant().Contains('workspace')) { throw 'initialize response lacks workspace-routing instructions' }
              return (Get-Content -Raw (Join-Path $env:JULIE_HOME 'service.json') | ConvertFrom-Json).pid
            }
            finally { Pop-Location }
          }
          $first = Join-Path $root 'first'
          $second = Join-Path $root 'second'
          New-Item -ItemType Directory -Force $first, $second | Out-Null
          $service_pid = Initialize-PackagedServer $first
          $second_pid = Initialize-PackagedServer $second
          if ($service_pid -ne $second_pid) { throw 'second initialize did not reuse the service PID' }
          $old_pid = $service_pid
          & $server service status
          & $server service restart
          $restart_pid = (Get-Content -Raw (Join-Path $env:JULIE_HOME 'service.json') | ConvertFrom-Json).pid
          if ($old_pid -eq $restart_pid) { throw 'service restart retained the old PID' }
          if (Get-Process -Id $old_pid -ErrorAction SilentlyContinue) { throw 'old service PID remains after restart' }
          & $server service stop
          if (Test-Path -LiteralPath (Join-Path $env:JULIE_HOME 'service.json')) { throw 'service discovery file remains after stop' }
          if (Get-Process julie-server -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $server }) { throw 'packaged service remains after stop' }

      - name: Verify Windows executable lock
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .github/scripts/test-windows-executable-lock.ps1 -Archive $env:ARCHIVE -CandidateSha $env:CANDIDATE_SHA

      - name: Upload qualification archive and log
        uses: actions/upload-artifact@v4
        with:
          name: native-qualification-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            ${{ runner.temp }}/julie-native-qualification/qualification.json
          retention-days: 7
